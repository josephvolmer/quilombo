name: Scrape BA events

on:
  schedule:
    # 09:17 UTC = 06:17 in Buenos Aires (UTC-3), daily.
    #
    # Deliberately off the hour: GitHub runs scheduled jobs on shared,
    # best-effort infrastructure and the top of the hour is the most
    # contended slot, where delays of 10-60+ minutes are common. An odd
    # minute usually starts much closer to on time.
    #
    # Argentina does not observe DST, so 09:17 UTC stays 06:17 BA all
    # year - no seasonal drift to correct for.
    - cron: "17 9 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

concurrency:
  group: scrape
  cancel-in-progress: false

# The run commits refreshed data back to main, which is what triggers the
# Cloudflare rebuild (~60s after the push). Without this the push fails
# with a 403, since GITHUB_TOKEN is read-only by default.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25     # Venti is budget-capped at 7min; the rest is ~3min

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check requests

      # Venti's robots.txt asks for Crawl-delay: 10. A cold sweep of ~226
      # event pages takes ~19 minutes; the cache keyed on sitemap lastmod
      # brings that down to ~1s. Restoring it is what keeps runs cheap.
      # Restore and save are split on purpose. actions/cache saves in a
      # post-job step, which GitHub SKIPS when an earlier step fails - so a
      # failed sanity check meant the cache was never written and the next
      # run paid Venti's full ~19min cold crawl again. Saving explicitly
      # with if:always() right after the scrape fixes that.
      - name: Restore Venti cache
        id: venti-cache
        uses: actions/cache/restore@v4
        with:
          path: data/venti_cache.json
          key: venti-cache-${{ github.run_id }}
          restore-keys: |
            venti-cache-

      - name: Run scrapers
        run: python -u scrapers/run.py | tee run.log

      # Save immediately, whether or not the checks below pass.
      - name: Save Venti cache
        if: always() && hashFiles('data/venti_cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/venti_cache.json
          key: venti-cache-${{ github.run_id }}

      - name: Summarise run
        if: always()
        run: |
          {
            echo '## Scrape results'
            echo '```'
            sed -n '/=====/,$p' run.log || tail -40 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail loudly if a run collapses: a source silently breaking is the
      # main risk with scrapers, and a green checkmark on 12 events is worse
      # than a red one.
      - name: Sanity-check output
        run: |
          python - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("data/events.json")
          if not p.exists():
              sys.exit("events.json was not written")
          rows = json.loads(p.read_text(encoding="utf-8"))
          future = [r for r in rows if r["date"] >= __import__("datetime").date.today().isoformat()]
          srcs = {s for r in rows for s in r["sources"]}
          print(f"{len(rows)} rows, {len(future)} future, {len(srcs)} sources: {sorted(srcs)}")
          if len(future) < 400:
              sys.exit(f"FAIL: only {len(future)} future events (expected 400+)")
          # Per-source floors: catch one feed silently collapsing.
          #
          # allaccess is deliberately absent. Its AWS WAF serves 200 to a
          # residential IP but blocks GitHub's datacenter ranges, so it
          # contributes 0 rows in CI and ~117 locally. That is an upstream
          # block, not a regression, so it must not fail the daily run.
          from collections import Counter
          per = Counter(s for r in rows for s in r["sources"])
          for name, floor in {"indiehoy": 120, "venti": 150,
                              "resident-advisor": 80}.items():
              if per.get(name, 0) < floor:
                  sys.exit(f"FAIL: {name} contributed {per.get(name,0)} rows (expected {floor}+)")
          for name in ("allaccess", "bebop", "songkick", "crobar"):
              if per.get(name, 0) == 0:
                  print(f"WARNING: {name} contributed 0 rows (blocked or broken?)")
          if len(srcs) < 5:
              sys.exit(f"FAIL: only {len(srcs)} sources reporting (expected 5+)")
          PY

      - name: Build static site
        run: python -u scrapers/build_site.py

      # Pushing here is what publishes the site: Cloudflare Pages
      # watches main and rebuilds on every commit.
      #
      # A scrape can take tens of minutes, so main may well have moved on
      # since checkout. Rebase onto the remote and retry rather than
      # failing the run: the data files are generated, so there is nothing
      # to merge - ours always wins.
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update events data ($(date -u +%Y-%m-%d))"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt $attempt)..."
            git fetch origin main
            # Generated files: keep ours on any conflict.
            git rebase -X ours origin/main || {
              git rebase --abort || true
              git reset --hard origin/main
              echo "Rebase failed; data will refresh on the next run."
              exit 0
            }
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

      # No deploy step: Cloudflare Pages is connected to this repo and
      # redeploys automatically whenever the commit above pushes to main.
